<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Calificaciones</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <nav class="barra">
        <span class="nombre-sistema">Sistema Escolar</span>
        <a>Subir calificaciones</a>
        <a>Editar calificaciones</a>
        <a  class="btn-salir">Cerrar sesión</a>
    </nav>

    <div class="caja">
    <div class="formulario">

            <h2>Editar Calificaciones</h2>
            <p class="texto-descripcion">Modifica calificaciones ya registradas.</p>

            <div class="campo">
            <label>Materia</label>
            <input type="text"></input>
            </div>

            <div class="campo">
            <label>Alumno</label>
            <input type="text"></input>
            </div>

            <div class="campo">
            <label>Calificación actual</label>
            <input type="number"></input>
            </div>

            <div class="campo">
            <label>Nueva calificación</label>
            <input type="number"></input>
            </div>

            <button class="btn-guardar">Guardar cambios</button>
            <button class="btn-cancelar">Cancelar</button>

    </div>
    </div>

</body>
</html>
