<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscribir Alumnos</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <nav class="barra">
        <span class="nombre-sistema">Sistema Escolar</span>
        <a>Inscribir alumnos</a>
        <a>Constancias</a>
        <a>Certificados</a>
        <a class="btn-salir">Cerrar sesión</a>
    </nav>

    <div class="caja">
    <div class="formulario">

            <h2>Inscribir Alumno</h2>
            <p class="texto-descripcion">Registrar un nuevo alumno.</p>

            <div class="fila-doble">
                <div class="campo">
                <label>Nombre</label>
                <input type="text">
                </div>

                <div class="campo">
                <label>Apellido paterno</label>
                <input type="text">
                </div>
            </div>

            <div class="fila-doble">
                <div class="campo">
                <label>Apellido materno</label>
                <input type="text">
                </div>

                <div class="campo">
                <label>Número de control</label>
                <input type="text">
                </div>
            </div>

            <div class="campo">
                <label>Correo institucional</label>
                <input type="email">
            </div>

            <div class="fila-doble">
                <div class="campo">
                    <label>Carrera</label>
                    <select></select>
                </div>

                <div class="campo">
                    <label for="semestre">Semestre</label>
                    <select></select>
                </div>
            </div>

            <button class="btn-guardar">Inscribir alumno</button>

    </div>
    </div>

</body>
</html>
