<body>

    <button onclick="crearElemento()">Agregar elemento</button>
    <input type="text" id="text">
    <br>
    <label for="r">R</label>
    <input type="number" id="r" min="0" max="255">
    <label for="g">G</label>
    <input type="number" id="g" min="0" max="255">
    <label for="b">B</label>
    <input type="number" id="b" min="0" max="255">
    <br>

    <div class="container">



    </div>

    <script>

        const container = document.querySelector(".container");
        const input = document.querySelector("input");
        let counter = 0;

        function crearElemento(){


            counter++;
            const element = document.createElement("div");
            element.textContent = input.value;
            element.classList.add("element");

            element.style.backgroundColor = `rgb(${r.value}, ${g.value}, ${b.value})`;

            container.appendChild(element);

            input.value="";
        }

    </script>

</body>
