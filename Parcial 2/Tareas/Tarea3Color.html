<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos JS - Color Picker</title>

    <style>
        .container{
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .element{
            width: 200px;
            height: 200px;
            background-color: aqua;
            text-align: center;
            font-weight: bold;
        }
        
    </style>
</head>

<body>
    <button onclick="crearElemento()">Agregar elemento</button>
    <input type="text" id="text">
    <br>
    
    <label for="colorInput">Color:</label>
    <input type="color" id="colorInput" value="#ff0000">
    <br>

    <div class="container">
    </div>

    <script>
        const container = document.querySelector(".container");
        const inputTexto = document.getElementById("text");
        const inputColor = document.getElementById("colorInput");
        let counter = 0;

        function crearElemento(){
            counter++;
            const element = document.createElement("div");
    
            element.textContent = inputTexto.value;
            element.classList.add("element");

            element.style.backgroundColor = inputColor.value;

            container.appendChild(element);
            inputTexto.value = ""; 
        }
    </script>
</body>
</html>
